version: "3.8"

services:
  installer:
    image: openjdk:11-slim-buster
    container_name: pega-installer
    command: ["./install-pega.sh"]
    volumes:
      - ./distr:/distr
      - ./application/postgresql-42.2.14.jar:/postgresql-42.2.14.jar
      - ./installer/install-pega.sh:/install-pega.sh
    depends_on:
      database:
        condition: service_healthy

  database:
    build: ./database
    image: pega-easy-install-database
    container_name: pega-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 10s
      retries: 120
    environment: 
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose: 
      - 5432
    ports: 
      - "59746:5432"
    volumes:
      - database-logs:/logs:rw

  kafka:
    image: apache/kafka:4.0.2
    container_name: pega-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Kafka's internal topics must also fit on the single broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: pega-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pega-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  application:
    build: ./application
    image: pega-easy-install-application
    container_name: pega-application
    restart: unless-stopped
    environment: 
      - JDBC_URL=jdbc:postgresql://database:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - JAVA_OPTS=-Dpega.logdir=/usr/local/tomcat/logs/pega_logs
      - NODE_TYPE=WebUser,BackgroundProcessing,Search
    ports: 
      - "8080:8080"
      - "8000:8000"
    volumes:
      - application-logs:/usr/local/tomcat/logs/pega_logs:rw
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
  
  web-tail:
    build: ./web-tail
    image: pega-easy-install-logs
    container_name: pega-logs
    restart: unless-stopped
    ports: 
      - "4444:4444"
    volumes:
      - application-logs:/usr/src/app/pega_logs
      - database-logs:/usr/src/app/database_logs

volumes:
  application-logs:
  database-logs:
  kafka-data:
